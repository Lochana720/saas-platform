# One command: docker compose up --build   →   http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas_owner                      # owns the schema, runs migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner_password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_password} # used by init script for app_user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_owner -d saas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:-app_password}@db:5432/saas
      MIGRATION_DATABASE_URL: postgresql://saas_owner:${POSTGRES_PASSWORD:-owner_password}@db:5432/saas
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-to-a-long-random-string-in-production}
      CORS_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      SEED_ON_START: ${SEED_ON_START:-true}
    expose:
      - "4000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
